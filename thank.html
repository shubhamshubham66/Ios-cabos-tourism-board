<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Thank You — DestinationPick × Los Cabos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600&family=Pinyon+Script&display=swap" rel="stylesheet">
  <style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --azure:#2b7fff;--sky:#426188;--lift:#9ec3ff;--ink:#1b1b1b;
  --muted:#5f6b7e;--muted-2:#8b95a8;--border:rgba(27,27,27,.1);--cloud:#f5f8fc;
  --dark-glass:rgba(24,30,42,.72);--blur:blur(16px) saturate(150%);
  --r-btn:999px;--r-card:14px;
  --head:'Cormorant Garamond',Georgia,serif;
  --script:'Pinyon Script',cursive;
  --sans:'DM Sans',system-ui,sans-serif;
}
html{scroll-behavior:smooth}
body{
  font-family:var(--sans);font-size:16px;color:var(--ink);line-height:1.5;
  background:linear-gradient(160deg,#e8eef6 0%,#f4efe8 45%,#e6ecf4 100%);
  background-attachment:fixed;min-height:100vh;-webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center;
}
a{color:inherit;text-decoration:none}

.thank-wrap{
  position:relative;
  width:100%;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:3rem 1.5rem;
  overflow:hidden;
}
.thank-bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:0;
  opacity:0.25;
}
.thank-scrim{
  position:absolute;
  inset:0;
  z-index:1;
  background:linear-gradient(160deg,rgba(232,238,246,0.85),rgba(244,239,232,0.9),rgba(230,236,244,0.85));
}
.thank-card{
  position:relative;
  z-index:2;
  text-align:center;
  max-width:580px;
  background:rgba(255,255,255,.58);
  -webkit-backdrop-filter:blur(16px) saturate(150%);
  backdrop-filter:blur(16px) saturate(150%);
  border:1px solid rgba(255,255,255,.55);
  border-radius:var(--r-card);
  padding:4rem 3rem;
  box-shadow:0 20px 60px rgba(27,27,27,0.08);
}
.thank-icon{
  font-family:var(--script);
  font-size:3rem;
  color:var(--sky);
  margin-bottom:1rem;
  animation:bounceIn 0.6s ease;
}
@keyframes bounceIn{
  0%{transform:scale(0.3);opacity:0}
  50%{transform:scale(1.1)}
  100%{transform:scale(1);opacity:1}
}
.thank-title{
  font-family:var(--head);
  font-size:clamp(2rem,5vw,3rem);
  font-weight:600;
  color:var(--ink);
  margin-bottom:0.5rem;
  line-height:1.15;
}
.thank-title em{
  font-family:var(--script);
  font-style:normal;
  font-weight:700;
  color:var(--sky);
}
.thank-line{
  width:32px;
  height:1.5px;
  background:var(--sky);
  margin:1.5rem auto;
}
.thank-body{
  font-size:0.95rem;
  color:var(--muted);
  line-height:1.8;
  margin-bottom:1.5rem;
}
.thank-body strong{
  color:var(--ink);
  font-weight:600;
}
.thank-note{
  font-size:0.85rem;
  color:var(--muted-2);
  font-style:italic;
  margin-bottom:2rem;
}
.thank-btn{
  display:inline-block;
  font-family:var(--sans);
  font-size:.7rem;
  font-weight:600;
  letter-spacing:.13em;
  text-transform:uppercase;
  padding:.9rem 2rem;
  border:1.5px solid var(--azure);
  border-radius:var(--r-btn);
  color:var(--ink);
  background:rgba(255,255,255,.32);
  -webkit-backdrop-filter:blur(10px) saturate(140%);
  backdrop-filter:blur(10px) saturate(140%);
  transition:background .22s,color .22s,transform .2s;
}
.thank-btn:hover{
  background:var(--azure);
  color:#fff;
  transform:translateY(-1px);
}
.thank-footer{
  margin-top:2.5rem;
  padding-top:1.5rem;
  border-top:1px solid var(--border);
  font-size:0.6rem;
  font-weight:500;
  letter-spacing:.08em;
  color:var(--muted-2);
}

@media(max-width:600px){
  .thank-card{padding:3rem 1.5rem;border-radius:12px}
}
  </style>
</head>
<body>

<div class="thank-wrap">
  <img class="thank-bg" src="images/hero-lands-end.jpg" alt="Los Cabos">
  <div class="thank-scrim"></div>
  <div class="thank-card">
    <div class="thank-icon">✦</div>
    <h1 class="thank-title">Thank <em>You</em></h1>
    <div class="thank-line"></div>
    <p class="thank-body">
      We've received your request successfully.<br><br>
      A Los Cabos specialist will send you <strong>personalized trip ideas within 24 hours</strong>.
    </p>
    <p class="thank-note">100% free • No spam • Custom travel recommendations</p>
    <a href="index.html" class="thank-btn">Back to Home</a>
    <div class="thank-footer">DestinationPick × Los Cabos Tourism Board</div>
  </div>
</div>

</body>
</html>
